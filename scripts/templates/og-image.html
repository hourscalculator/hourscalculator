<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Punch Card Calculator</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; padding: 62px 72px; background: #f5f5f0; color: #23312b; font-family: Arial, Helvetica, sans-serif; }
h1 { margin: 0 0 18px; font-size: 60px; letter-spacing: -2px; }
h1 span { color: #315d48; }
p { margin: 0; font-size: 28px; color: #566751; }
.card { margin-top: 42px; background: white; border: 1px solid #cdd4cc; border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; align-items: center; padding: 20px 28px; font-size: 27px; }
.header { background: #edf2eb; color: #315d48; font-size: 18px; font-weight: bold; }
.total { border-top: 1px solid #dce0d6; background: #f9faf7; padding: 18px 28px; font-size: 21px; color: #566751; }
footer { position: absolute; right: 72px; bottom: 42px; color: #315d48; font-size: 23px; }
</style>
<h1>Punch <span>Card</span> Calculator</h1>
<p>Hours, lunch breaks, overtime &amp; gross pay</p>
<div class="card">
  <div class="row header"><span>DAY</span><span>IN</span><span>OUT</span><span>HOURS</span></div>
  <div class="row"><strong>Monday</strong><span>9:00</span><span>17:30</span><strong>8:00</strong></div>
  <div class="total">Lunch break · 30 minutes</div>
</div>
<footer>punchcardcalculator.com</footer>
</html>
